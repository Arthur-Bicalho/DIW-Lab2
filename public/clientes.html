<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes - Aluguel de Carros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar" aria-label="Principal"></nav>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0" id="titulo-pagina">Clientes</h1>
    </div>

    <div id="alertas" aria-live="polite"></div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <caption class="visually-hidden">Lista de clientes cadastrados</caption>
        <thead>
          <tr>
            <th scope="col">Nome</th>
            <th scope="col">CPF</th>
            <th scope="col">Profissão</th>
            <th scope="col">Rendimento total</th>
            <th scope="col"><span class="visually-hidden">Ações</span></th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>
    <p id="sem-clientes" class="text-muted" hidden>Nenhum cliente cadastrado.</p>
  </main>

  <div class="modal fade" id="modal-cliente" tabindex="-1" aria-labelledby="titulo-modal" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form class="modal-content" id="form-cliente" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal">Editar cliente</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="alertas-formulario px-3 pt-3" aria-live="polite"></div>
        <div class="modal-body row g-3" id="campos"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/paginas/views/clientes.js"></script>
</body>
</html>
