<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes - Aluguel de Carros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Clientes</h1>
      <button type="button" class="btn btn-primary" id="novo-cliente">Novo cliente</button>
    </div>

    <div id="alertas" aria-live="polite"></div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <caption class="visually-hidden">Lista de clientes cadastrados</caption>
        <thead>
          <tr>
            <th scope="col">Nome</th>
            <th scope="col">CPF</th>
            <th scope="col">Profissão</th>
            <th scope="col">Rendimento total</th>
            <th scope="col"><span class="visually-hidden">Ações</span></th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>
    <p id="sem-clientes" class="text-muted" hidden>Nenhum cliente cadastrado.</p>
  </main>

  <div class="modal fade" id="modal-cliente" tabindex="-1" aria-labelledby="titulo-modal" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form class="modal-content" id="form-cliente" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal">Novo cliente</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-md-12">
            <label class="form-label" for="nome">Nome</label>
            <input class="form-control" id="nome" name="nome" type="text" required aria-describedby="erro-nome">
            <div class="invalid-feedback" id="erro-nome"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" id="email" name="email" type="email" required aria-describedby="erro-email">
            <div class="invalid-feedback" id="erro-email"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="senha">Senha</label>
            <input class="form-control" id="senha" name="senha" type="password" minlength="6" autocomplete="new-password" aria-describedby="erro-senha">
            <div class="invalid-feedback" id="erro-senha"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="rg">RG</label>
            <input class="form-control" id="rg" name="rg" type="text" required aria-describedby="erro-rg">
            <div class="invalid-feedback" id="erro-rg"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="cpf">CPF</label>
            <input class="form-control" id="cpf" name="cpf" type="text" required inputmode="numeric" placeholder="000.000.000-00" aria-describedby="erro-cpf">
            <div class="invalid-feedback" id="erro-cpf"></div>
          </div>
          <div class="col-md-12">
            <label class="form-label" for="endereco">Endereço</label>
            <input class="form-control" id="endereco" name="endereco" type="text" required aria-describedby="erro-endereco">
            <div class="invalid-feedback" id="erro-endereco"></div>
          </div>
          <div class="col-md-12">
            <label class="form-label" for="profissao">Profissão</label>
            <input class="form-control" id="profissao" name="profissao" type="text" required aria-describedby="erro-profissao">
            <div class="invalid-feedback" id="erro-profissao"></div>
          </div>
          <fieldset class="col-12">
            <legend class="h6">Entidades empregadoras (máximo de 3)</legend>
            <div id="entidades"></div>
            <div class="invalid-feedback" id="erro-entidadesEmpregadoras"></div>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="adicionar-entidade">Adicionar entidade</button>
          </fieldset>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/paginas/views/clientes.js"></script>
</body>
</html>
