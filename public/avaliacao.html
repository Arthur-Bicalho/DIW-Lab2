<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avaliação de pedidos - Aluguel de Carros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar" aria-label="Principal"></nav>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
      <h1 class="h3 mb-0">Pedidos</h1>
      <div>
        <label class="form-label mb-1" for="filtro-status">Status</label>
        <select class="form-select" id="filtro-status">
          <option value="">Todos</option>
        </select>
      </div>
    </div>

    <div id="alertas" aria-live="polite"></div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <caption class="visually-hidden">Pedidos de aluguel de todos os clientes</caption>
        <thead>
          <tr>
            <th scope="col">Cliente</th>
            <th scope="col">Automóvel</th>
            <th scope="col">Período</th>
            <th scope="col">Status</th>
            <th scope="col">Agente</th>
            <th scope="col"><span class="visually-hidden">Ações</span></th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>
    <p id="sem-pedidos" class="text-muted" hidden>Nenhum pedido encontrado.</p>
  </main>

  <div class="modal fade" id="modal-pedido" tabindex="-1" aria-labelledby="titulo-modal-pedido" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="form-pedido" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal-pedido">Modificar pedido</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="alertas-formulario px-3 pt-3" aria-live="polite"></div>
        <div class="modal-body row g-3" id="campos"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="modal-avaliacao" tabindex="-1" aria-labelledby="titulo-modal-avaliacao" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <form class="modal-content" id="form-avaliacao" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal-avaliacao">Avaliar pedido</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="alertas-formulario px-3 pt-3" aria-live="polite"></div>
        <div class="modal-body">
          <h3 class="h6">Análise financeira</h3>
          <p class="mb-1" id="resumo-cliente"></p>
          <ul class="mb-3" id="lista-rendimentos"></ul>
          <p class="fw-semibold" id="total-rendimentos"></p>

          <fieldset class="mb-3">
            <legend class="h6">Parecer</legend>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="positivo" id="parecer-positivo" value="true" aria-describedby="erro-positivo">
              <label class="form-check-label" for="parecer-positivo">Positivo (aprovar)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="positivo" id="parecer-negativo" value="false" aria-describedby="erro-positivo">
              <label class="form-check-label" for="parecer-negativo">Negativo (reprovar)</label>
            </div>
            <div class="invalid-feedback" id="erro-positivo"></div>
          </fieldset>
          <div>
            <label class="form-label" for="justificativa">Justificativa</label>
            <textarea class="form-control" id="justificativa" name="justificativa" rows="3" required aria-required="true" aria-describedby="erro-justificativa"></textarea>
            <div class="invalid-feedback" id="erro-justificativa"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Emitir parecer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/paginas/views/avaliacao.js"></script>
</body>
</html>
