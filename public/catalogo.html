<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo - Aluguel de Carros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar" aria-label="Principal"></nav>
  <main class="container py-4">
    <h1 class="h3 mb-3">Catálogo de automóveis</h1>

    <div id="alertas" aria-live="polite"></div>

    <form id="filtros" class="row g-3 align-items-end mb-3" role="search" aria-label="Filtros do catálogo">
      <div class="col-12 col-md-4">
        <label class="form-label" for="filtro-modelo">Marca ou modelo</label>
        <input class="form-control" id="filtro-modelo" type="search" autocomplete="off">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label" for="filtro-ano">Ano</label>
        <select class="form-select" id="filtro-ano"></select>
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label" for="filtro-categoria">Categoria</label>
        <select class="form-select" id="filtro-categoria"></select>
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label" for="filtro-segmento">Segmento</label>
        <select class="form-select" id="filtro-segmento"></select>
      </div>
      <div class="col-6 col-md-auto">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="filtro-eletrico">
          <label class="form-check-label" for="filtro-eletrico">Somente elétricos</label>
        </div>
      </div>
      <div class="col-12 col-md-auto">
        <button type="reset" class="btn btn-outline-secondary" id="limpar">Limpar filtros</button>
      </div>
    </form>

    <p id="contagem" class="text-muted" role="status" aria-live="polite"></p>
    <div id="sem-resultados" class="alert alert-info" hidden>Nenhum automóvel encontrado com esses filtros.</div>
    <div id="grade" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3"></div>
    <nav id="paginacao" class="mt-4" aria-label="Paginação do catálogo"></nav>
  </main>

  <div class="modal fade" id="modal-foto" tabindex="-1" aria-labelledby="titulo-foto" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-foto"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <img class="img-fluid w-100 rounded" alt="">
          <p class="legenda mt-3 mb-1"></p>
          <p class="credito small text-muted mb-0"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/paginas/views/catalogo.js"></script>
</body>
</html>
