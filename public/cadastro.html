<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro - Aluguel de Carros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-4" style="max-width: 44rem;">
    <h1 class="h3 mb-3">Cadastro de cliente</h1>
    <div id="alertas" aria-live="polite"></div>
    <form id="form-cliente" class="card card-body" novalidate>
      <div class="alertas-formulario" aria-live="polite"></div>
      <div class="row g-3" id="campos"></div>
      <button type="submit" class="btn btn-primary mt-3">Cadastrar</button>
    </form>
    <p class="mt-3">Já tem conta? <a href="login.html">Entrar</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/paginas/views/cadastro.js"></script>
</body>
</html>
